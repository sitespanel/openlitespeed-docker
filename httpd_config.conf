#
# The image's main configuration (TASK-0198, step 2): the shipped global settings, with the dedicated server user and group (condition 1 of the
# security test), no virtual host, no listener and no PHP handler. The panel's agent writes the real one (step 4) from this text. A shorter
# configuration without the accessDenyDir, fileAccessControl, perClientConnLimit, CGIRLimit and accessControl blocks could not start lsphp as another
# user (found in step 2; which block matters was not isolated), so they stay.
#
serverName                       
user                             ols
group                            ols
priority                         0
autoRestart                      1 
chrootPath                       / 
enableChroot                     0 
inMemBufSize                     60M 
swappingDir                      /tmp/lshttpd/swap 
autoFix503                       1 
gracefulRestartTimeout           300
mime                             conf/mime.properties 
showVersionNumber                0 
adminEmails                      root@localhost
indexFiles                       index.html, index.php
disableWebAdmin                  1

errorlog logs/error.log {
        logLevel             DEBUG
        debugLevel           0
        rollingSize          10M
        enableStderrLog      1
}
    
accessLog logs/access.log {
        rollingSize          10M    
        keepDays             30    
        compressArchive      0
        logReferer           1     
        logUserAgent         1
}
    
expires {
    enableExpires           1
    expiresByType           image/*=A604800,text/css=A604800,application/x-javascript=A604800,application/javascript=A604800,font/*=A604800,application/x-font-ttf=A604800
}

tuning{
    maxConnections               10000
    maxSSLConnections            10000
    connTimeout                  300 
    maxKeepAliveReq              10000
    smartKeepAlive               0 
    keepAliveTimeout             5 
    sndBufSize                   0 
    rcvBufSize                   0 
    gzipStaticCompressLevel      6 
    gzipMaxFileSize              10M 
    eventDispatcher              best 
    maxCachedFileSize            4096 
    totalInMemCacheSize          20M 
    maxMMapFileSize              256K 
    totalMMapCacheSize           40M 
    useSendfile                  1 
    fileETag                     28 
    SSLCryptoDevice              null 
    maxReqURLLen                 32768 
    maxReqHeaderSize             65536 
    maxReqBodySize               2047M 
    maxDynRespHeaderSize         32768 
    maxDynRespSize               2047M 
    enableGzipCompress           1
    enableBrCompress             4
    enableDynGzipCompress        1 
    gzipCompressLevel            6 
    brStaticCompressLevel        6
    compressibleTypes            default
    gzipAutoUpdateStatic         1 
    gzipMinFileSize              300 
    
    quicEnable                   1
    quicShmDir                   /dev/shm/ols
    
}

accessDenyDir{
    dir                  /
    dir                  /etc/*
    dir                  /dev/*
    dir                  conf/*
    dir                  admin/conf/*
}

fileAccessControl{
    followSymbolLink                            1 
    checkSymbolLink                             0 
    requiredPermissionMask                      000 
    restrictedPermissionMask                    000 
}

perClientConnLimit{
    staticReqPerSec                          0 
    dynReqPerSec                             0 
    outBandwidth                             0 
    inBandwidth                              0 
    softLimit                                10000 
    hardLimit                                10000 
    gracePeriod                              15 
    banPeriod                                300 
}

CGIRLimit{
    maxCGIInstances                         20 
    minUID                                  11 
    minGID                                  10 
    priority                                0 
    CPUSoftLimit                            10 
    CPUHardLimit                            50 
    memSoftLimit                            2047M
    memHardLimit                            2047M
    procSoftLimit                           400 
    procHardLimit                           450 
}
    
accessControl{
	allow                                   ALL
	deny
}

# Loopback only, with an idle virtual host (an empty folder, no scripts): the server refuses to run without a listener and a virtual host. The agent writes the real
# listeners (step 4).
virtualHost idle{
  vhRoot                           /usr/local/lsws/idle-html/
  configFile                       conf/vhosts/idle/vhconf.conf
  allowSymbolLink                  0
  enableScript                     0
  restrained                       1
}

listener idle{
  address                          127.0.0.1:8088
  secure                           0
  map                              idle *
}
