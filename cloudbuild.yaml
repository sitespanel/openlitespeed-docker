# Cloud Build: OpenLiteSpeed with LSPHP 8.4 image for SitesPanel.
# Publish build: a push to main and the weekly rebuild. Builds one image after another on the default
# machine (the free build-minutes apply only to it), scans each with Trivy, and pushes to ghcr.io only when
# every scan passed; then attaches each image's SPDX SBOM to its digest (SitesPanel ADR-0065).

substitutions:
  _REGISTRY: ghcr.io/sitespanel
  _GHCR_USER: sitespanel-image-builder  # the GitHub account that owns the push token
  _GHCR_TOKEN_SECRET: sitespanel-ghcr-image-push-token-cloudbuild  # Secret Manager secret holding the token

steps:
  - id: build-openlitespeed-8.4
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/openlitespeed-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - "--label=org.opencontainers.image.description=SitesPanel OpenLiteSpeed image with LSPHP 8.4, for sites that run on OpenLiteSpeed."
      - --tag=${_REGISTRY}/openlitespeed:8.4
      - --tag=${_REGISTRY}/openlitespeed:8.4-$SHORT_SHA
      - .
    waitFor: ['-']
  - id: scan-openlitespeed-8.4
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/openlitespeed-8.4.tar ${_REGISTRY}/openlitespeed:8.4']
    waitFor: ['build-openlitespeed-8.4']
  - id: trivy-openlitespeed-8.4
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/openlitespeed-8.4.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/openlitespeed-8.4.tar --format spdx-json --output /workspace/sbom/openlitespeed-8.4.spdx.json
        rm -f /workspace/openlitespeed-8.4.tar
    waitFor: ['scan-openlitespeed-8.4']
  # Push only after every scan passed. The token never appears in the log.
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['GHCR_TOKEN']
    args:
      - -ceu
      - |
        echo "$$GHCR_TOKEN" | docker login ghcr.io --username ${_GHCR_USER} --password-stdin
        docker push ${_REGISTRY}/openlitespeed:8.4
        docker push ${_REGISTRY}/openlitespeed:8.4-$SHORT_SHA
        docker inspect --format '{{index .RepoDigests 0}}' ${_REGISTRY}/openlitespeed:8.4 > /workspace/openlitespeed-8.4.digest
    waitFor: ['trivy-openlitespeed-8.4']
  # Each SBOM is attached to its image's digest in ghcr.io, so it travels with the image.
  - id: sbom
    name: ghcr.io/oras-project/oras:v1.3.5@sha256:2f43a2bd4797df77ab38cf24ec92ae34a98a82cdf4ec507537e44081c603630e
    entrypoint: sh
    args:
      - -ceu
      - |
        oras attach --registry-config /builder/home/.docker/config.json --artifact-type application/spdx+json "$$(cat /workspace/openlitespeed-8.4.digest)" /workspace/sbom/openlitespeed-8.4.spdx.json:application/spdx+json
    waitFor: ['push']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_GHCR_TOKEN_SECRET}/versions/latest
      env: GHCR_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
