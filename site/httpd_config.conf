# Written by the SitesPanel agent. Do not edit: it is replaced at every change.
useIpInProxyHeader               2
serverName                       
user                             ols
group                            ols
priority                         0
autoRestart                      1
chrootPath                       /
enableChroot                     0
inMemBufSize                     60M
swappingDir                      /tmp/lshttpd/swap
autoFix503                       1
gracefulRestartTimeout           300
mime                             conf/mime.properties
showVersionNumber                0
adminEmails                      root@localhost
disableWebAdmin                  1

errorlog logs/error.log {
    logLevel                     NOTICE
    debugLevel                   0
    rollingSize                  10M
    enableStderrLog              1
}

accessLog logs/access.log {
    rollingSize                  10M
    keepDays                     30
    compressArchive              0
}

tuning{
    maxConnections               2000
    maxSSLConnections            200
    connTimeout                  300
    keepAliveTimeout             5
    eventDispatcher              best
    maxReqURLLen                 32768
    maxReqHeaderSize             65536
    maxReqBodySize               1M
    maxDynRespHeaderSize         32768
    maxDynRespSize               2047M
    quicEnable                   0
}

accessDenyDir{
    dir                              /
    dir                              /etc/*
    dir                              /dev/*
    dir                              conf/*
    dir                              admin/conf/*
}

fileAccessControl{
    followSymbolLink                 1
    checkSymbolLink                  0
    requiredPermissionMask           000
    restrictedPermissionMask         000
}

perClientConnLimit{
    staticReqPerSec                  0
    dynReqPerSec                     0
    outBandwidth                     0
    inBandwidth                      0
    softLimit                        10000
    hardLimit                        10000
    gracePeriod                      15
    banPeriod                        300
}

CGIRLimit{
    maxCGIInstances                  20
    minUID                           11
    minGID                           10
    priority                         0
    CPUSoftLimit                     10
    CPUHardLimit                     50
    memSoftLimit                     2047M
    memHardLimit                     2047M
    procSoftLimit                    400
    procHardLimit                    450
}

accessControl{
    allow                            198.18.250.2T
}

virtualHost site{
    vhRoot                           /var/www/html/
    configFile                       /usr/local/lsws/site/vhconf.conf
    allowSymbolLink                  1
    enableScript                     0
    restrained                       1
}

listener http{
    address                          198.18.250.3:8080
    secure                           0
    map                              site *
}
